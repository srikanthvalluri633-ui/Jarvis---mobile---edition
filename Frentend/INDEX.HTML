
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S Mobile</title>

  <style>
    body {
      background: #050b18;
      color: #00eaff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    h1 {
      margin-top: 40px;
      letter-spacing: 4px;
    }

    .core {
      width: 180px;
      height: 180px;
      border: 4px solid #00eaff;
      border-radius: 50%;
      margin: 50px auto;
      box-shadow: 0 0 30px #00eaff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: glow 2s infinite alternate;
    }

    .core span {
      font-size: 50px;
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px #00eaff; }
      to { box-shadow: 0 0 40px #00eaff; }
    }

    button {
      background: #00eaff;
      color: #00101a;
      border: none;
      padding: 15px 35px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <h1>J.A.R.V.I.S</h1>
  <p>MOBILE EDITION</p>

  <div class="core">
    <span>AI</span>
  </div>

  <button onclick="speak()">🎙️ SPEAK</button>

  <p id="status">SYSTEM ONLINE</p>

  <script>
    function speak() {
      const message = "Hello! I am Jarvis. How can I help you?";

      const speech = new SpeechSynthesisUtterance(message);
      speech.lang = "en-US";
      speech.rate = 1;

      window.speechSynthesis.speak(speech);

      document.getElementById("status").innerText =
        "JARVIS IS SPEAKING";
    }
  </script>

</body>
</html>
