
<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
body {
  background: #050b18;
  color: #00eaff;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}
h1 { margin-top: 40px; }
.core {
  width: 160px;
  height: 160px;
  border: 3px solid #00eaff;
  border-radius: 50%;
  margin: 45px auto;
  display: grid;
  place-items: center;
  box-shadow: 0 0 30px #00eaff;
  font-size: 30px;
}
button {
  background: #00eaff;
  color: #00101a;
  border: none;
  padding: 16px 28px;
  border-radius: 30px;
  font-size: 18px;
}
#reply { color: white; }
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<p>MY PERSONAL AI ASSISTANT</p>

<div class="core">AI</div>

<button onclick="listen()">🎤 TALK TO JARVIS</button>

<p id="status">SYSTEM ONLINE</p>
<p id="reply">Hello! I am Jarvis.</p>

<script>
const SR = window.SpeechRecognition ||
           window.webkitSpeechRecognition;

function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "te-IN";
  speechSynthesis.speak(msg);
  document.getElementById("reply").innerText = text;
}

function listen() {
  if (!SR) {
    speak("Voice recognition is not supported");
    return;
  }

  const rec = new SR();
  rec.lang = "te-IN";

  rec.onstart = () => {
    document.getElementById("status").innerText =
      "LISTENING...";
  };

  rec.onresult = (event) => {
    const command =
      event.results[0][0].transcript.toLowerCase();

    if (command.includes("youtube")) {
      speak("Opening YouTube");
      setTimeout(() =>
        window.open("https://m.youtube.com", "_blank"), 1000);
    }
    else if (command.includes("google")) {
      speak("Opening Google");
      setTimeout(() =>
        window.open("https://google.com", "_blank"), 1000);
    }
    else if (command.includes("హాయ్") ||
             command.includes("hello")) {
      speak("హాయ్ బ్రో! నేను జార్విస్.");
    }
    else {
      speak("నీ మాట విన్నాను. ఇంకా AI కనెక్షన్ అవసరం.");
    }
  };

  rec.onerror = () => {
    document.getElementById("status").innerText =
      "VOICE ERROR";
  };

  rec.start();
}
</script>

</body>
</html>
